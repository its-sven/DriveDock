name: Release

# Push a tag like v1.2.3 to build, package and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      # Optional: sign every release with the same self-signed certificate (see
      # docs/RELEASING.md), so users keep their keychain permission across updates.
      - name: Import release signing certificate
        env:
          RELEASE_CERT_P12: ${{ secrets.RELEASE_CERT_P12 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: |
          if [ -z "$RELEASE_CERT_P12" ]; then
            echo "No RELEASE_CERT_P12 secret – signing ad hoc."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$RELEASE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$KEYCHAIN" -P "$RELEASE_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=DriveDock Release Signing" >> "$GITHUB_ENV"

      - name: Build and package
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/package.sh

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The section of CHANGELOG.md for this version.
          awk -v v="[$VERSION]" '/^## \[/ { if (found) exit; if (index($0, v)) { found = 1; next } } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "DriveDock $VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ### Install

          1. Download **DriveDock-*.dmg**, open it and drag DriveDock into **Applications**.
          2. DriveDock is not notarized yet. On first launch macOS asks whether to open it:
             open **System Settings → Privacy & Security** and click **Open Anyway**
             (or run `xattr -dr com.apple.quarantine /Applications/DriveDock.app`).

          Homebrew: `brew install --cask its-sven/tap/drivedock`
          NOTES

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --title "DriveDock ${GITHUB_REF_NAME#v}" --notes-file notes.md

      # Optional: keep the cask in its-sven/homebrew-tap in sync. Needs a fine-grained
      # token with "Contents: read and write" on that repository as HOMEBREW_TAP_TOKEN.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "No HOMEBREW_TAP_TOKEN secret – skipping."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256="$(shasum -a 256 "dist/DriveDock-$VERSION.zip" | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/its-sven/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA256/" \
              -e '/^# Template for the cask/d' -e '/^# The release workflow fills in/d' \
              packaging/homebrew/drivedock.rb > tap/Casks/drivedock.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/drivedock.rb
          git commit -m "drivedock $VERSION"
          git push
